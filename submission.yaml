submission:
  title: "RouteWise AI - Supply Chain Disruption Assistant"
  problem_statement: >
    Supply chain disruptions like weather events and port strikes cascade across shipments, 
    making it impossible for logistics teams to track manually. Critical cold-chain assets 
    (vaccines, perishables) are often spoiled because delays are discovered too late.
  solution_summary: >
    RouteWise AI is an intelligent logistics copilot powered by IBM watsonx. It continuously 
    monitors fleet IoT data and external disruption feeds. Using a conversational interface, 
    managers can instantly identify at-risk shipments and receive AI-generated rerouting recommendations.
  key_features:
    - "Conversational AI assistant for natural language querying of active shipments"
    - "Real-time disruption mapping (simulated weather/port strikes) via MCP connectors"
    - "Automated IoT cold-chain temperature anomaly detection"
    - "Predictive rerouting and idle fleet redeployment recommendations"
